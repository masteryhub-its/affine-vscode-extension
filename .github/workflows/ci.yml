name: CI

on:
  push:
    branches: [main]
  pull_request:

# Catalog smoke (250 docs, 2s cold-sync budget) runs inside `npm run validate` via src/sync/catalog-smoke.spec.ts.

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install -g npm@11.6.2
      - run: npm ci
      - run: npm run validate
      - run: npm run compile
