name: Bug report
description: Something in the AFFiNE VS Code / Cursor extension is broken
title: '[bug] '
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: Thanks for reporting. For AFFiNE *server* bugs, use the [AFFiNE repo](https://github.com/toeverything/AFFiNE/issues) instead.
  - type: input
    id: version
    attributes:
      label: Extension version
      placeholder: '0.2.0'
    validations:
      required: true
  - type: input
    id: editor
    attributes:
      label: Editor
      description: VS Code or Cursor, including version if you know it
      placeholder: Cursor 1.x / VS Code 1.90
    validations:
      required: true
  - type: input
    id: server
    attributes:
      label: AFFiNE server
      description: Cloud or self-hosted URL (no tokens)
      placeholder: https://affine.example.com
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Steps, expected result, actual result
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Output channel “AFFiNE” (redact tokens and cookies)
      render: text
